<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cohérence">

<title>Cohérence cardiaque</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    background: #06253a;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;

    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    height: 100vh;

    min-height: 580px;

    padding:
        max(16px, env(safe-area-inset-top))
        18px
        max(12px, env(safe-area-inset-bottom));

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TITRE
========================================================= */

.header {
    text-align: center;
    flex-shrink: 0;
}

.title {
    font-size: clamp(22px, 6vw, 27px);
    font-weight: 500;

    margin-top: 2px;
    margin-bottom: 3px;
}

.subtitle {
    color: #c5d6dd;
    font-size: clamp(11px, 3.5vw, 14px);
}


/* =========================================================
   ZONE RESPIRATION
========================================================= */

.breathing-area {
    flex: 1;

    min-height: 190px;
    max-height: 330px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   CERCLE RESPIRATOIRE
========================================================= */

.breathing-ring {

    width: min(245px, 54vw);
    height: min(245px, 54vw);

    min-width: 165px;
    min-height: 165px;

    max-width: 245px;
    max-height: 245px;

    border-radius: 50%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #103e50 0%,
            #0b3446 70%,
            #092e40 100%
        );

    border: 7px solid #54dcae;

    box-shadow:
        0 0 25px rgba(82,220,174,.12),
        inset 0 0 30px rgba(0,0,0,.12);

    transform: scale(.84);

    transition:
        transform var(--breath-duration, 5s) ease-in-out,
        border-color var(--breath-duration, 5s) ease-in-out,
        background var(--breath-duration, 5s) ease-in-out,
        box-shadow var(--breath-duration, 5s) ease-in-out;
}


/* Anneau extérieur */

.breathing-ring::after {

    content: "";

    position: absolute;

    inset: -7px;

    border-radius: 50%;

    border: 3px solid rgba(67,183,255,.65);

    border-right-color: #60dfa9;
    border-bottom-color: #60dfa9;

    pointer-events: none;

    transition:
        border-color var(--breath-duration, 5s)
        ease-in-out;
}


/* INSPIRATION */

.breathing-ring.inhale {

    transform: scale(1.02);

    background:
        radial-gradient(
            circle,
            #15536a 0%,
            #10455a 65%,
            #0d394d 100%
        );

    border-color: #62e8b1;

    box-shadow:
        0 0 38px rgba(98,232,177,.25),
        inset 0 0 35px rgba(0,0,0,.08);
}


/* EXPIRATION */

.breathing-ring.exhale {

    transform: scale(.84);

    background:
        radial-gradient(
            circle,
            #123c61 0%,
            #0d3451 65%,
            #092c45 100%
        );

    border-color: #54baff;

    box-shadow:
        0 0 30px rgba(84,186,255,.18),
        inset 0 0 35px rgba(0,0,0,.12);
}


/* =========================================================
   CONTENU DU CERCLE
========================================================= */

.breathing-content {

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    z-index: 2;
}

.phase {

    color: #61e3ae;

    font-size: clamp(22px, 7vw, 28px);

    font-weight: 500;

    line-height: 1.1;

    margin: 0;
}

.seconds {

    font-size: clamp(14px, 4.5vw, 18px);

    margin-top: 7px;

    color: white;
}


/* =========================================================
   PERSONNE EN MÉDITATION
========================================================= */

.meditation {

    font-size: clamp(31px, 10vw, 42px);

    line-height: 1;

    margin-top: 11px;

    filter:
        drop-shadow(0 2px 3px rgba(0,0,0,.2));
}


/* =========================================================
   INSTRUCTION
========================================================= */

.instruction {

    text-align: center;

    color: #aebfc7;

    font-size: clamp(11px, 3.5vw, 14px);

    margin-bottom: 8px;

    flex-shrink: 0;
}


/* =========================================================
   CARTES
========================================================= */

.card {

    background:
        rgba(19,67,87,.76);

    border:
        1px solid rgba(180,220,230,.13);

    border-radius: 16px;

    padding: 10px 13px;

    margin-bottom: 7px;

    flex-shrink: 0;
}

.card-title {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: clamp(13px, 3.8vw, 15px);

    font-weight: 500;
}

.card-icon {

    font-size: 20px;

    color: #52b9ff;
}


/* =========================================================
   RYTHME
========================================================= */

.breath-controls {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 6px;
}

.control-label {

    color: #dbe5e9;

    font-size: clamp(12px, 3.5vw, 14px);
}

.adjust {

    display: flex;

    align-items: center;

    gap: 10px;
}

.small-button {

    width: 32px;
    height: 32px;

    min-width: 32px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.07);

    color: white;

    font-size: 21px;

    line-height: 1;
}

.value {

    min-width: 62px;

    text-align: center;

    font-size: 15px;

    font-weight: 600;
}


/* =========================================================
   DURÉE
========================================================= */

.duration-top {

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.remaining {

    color: #63e3ae;

    font-size: 19px;
}

.duration-controls {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 22px;

    margin-top: 4px;
}

.duration-value {

    min-width: 70px;

    text-align: center;

    font-size: 16px;

    font-weight: 600;
}

.slider {

    width: 100%;

    height: 5px;

    margin-top: 5px;

    appearance: none;

    border-radius: 5px;

    background:
        linear-gradient(
            90deg,
            #61dfab var(--progress),
            rgba(255,255,255,.18) var(--progress)
        );
}

.slider::-webkit-slider-thumb {

    appearance: none;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: #62dfac;

    border: 3px solid #174c56;
}

.slider-labels {

    display: flex;

    justify-content: space-between;

    color: #8faab5;

    font-size: 9px;

    margin-top: 2px;
}


/* =========================================================
   SONS
========================================================= */

.sound-grid {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;

    margin-top: 6px;
}

.sound-column {

    background:
        rgba(0,0,0,.10);

    border-radius: 10px;

    padding: 5px 7px;
}

.sound-heading {

    display: flex;

    align-items: center;

    gap: 6px;

    font-size: 12px;

    margin-bottom: 3px;
}

.sound-dot {

    width: 12px;
    height: 12px;

    border-radius: 50%;
}

.green {
    background: #61dfa9;
}

.blue {
    background: #48a9ff;
}

.sound-option {

    width: 100%;

    height: 27px;

    border: none;

    border-radius: 7px;

    background: transparent;

    color: #b8cbd3;

    text-align: left;

    padding: 0 5px;

    font-size: 11px;
}

.sound-option.selected {

    background:
        rgba(98,225,174,.18);

    color: white;
}


/* =========================================================
   BOUTONS
========================================================= */

.start-button {

    width: 100%;

    height: 49px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #61dfa9,
            #5edbaa
        );

    color: white;

    font-size: 17px;

    font-weight: 600;

    flex-shrink: 0;

    margin-top: 1px;
}

.stop-button {

    display: none;

    background:
        linear-gradient(
            90deg,
            #db686d,
            #c85862
        );
}

.start-button:active {

    transform: scale(.985);
}


/* =========================================================
   PARAMÈTRES DE L'ALARME
========================================================= */

.settings-button {

    width: 100%;

    height: 40px;

    margin-top: 7px;

    border: none;

    border-radius: 12px;

    background:
        rgba(255,255,255,.07);

    color: #c9d8de;

    font-size: 13px;

    flex-shrink: 0;
}

.settings-panel {

    display: none;

    background:
        rgba(12,48,65,.96);

    border:
        1px solid rgba(180,220,230,.14);

    border-radius: 15px;

    padding: 12px;

    margin-top: 7px;

    margin-bottom: 7px;

    flex-shrink: 0;
}

.settings-panel.open {
    display: block;
}

.settings-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    min-height: 38px;

    border-bottom:
        1px solid rgba(255,255,255,.07);

    gap: 10px;
}

.settings-row:last-child {
    border-bottom: none;
}

.settings-label {

    color: #d9e5e9;

    font-size: 13px;
}


/* =========================================================
   INTERRUPTEUR ALARME
========================================================= */

.switch {

    position: relative;

    width: 48px;
    height: 28px;

    flex-shrink: 0;
}

.switch input {

    opacity: 0;

    width: 0;
    height: 0;
}

.switch-slider {

    position: absolute;

    cursor: pointer;

    inset: 0;

    background: #52646c;

    border-radius: 30px;

    transition: .25s;
}

.switch-slider::before {

    content: "";

    position: absolute;

    width: 22px;
    height: 22px;

    left: 3px;
    top: 3px;

    background: white;

    border-radius: 50%;

    transition: .25s;
}

.switch input:checked + .switch-slider {

    background: #61dfa9;
}

.switch input:checked + .switch-slider::before {

    transform: translateX(20px);
}


/* =========================================================
   PETIT ÉCRAN
========================================================= */

@media (max-height: 700px) {

    .app {

        padding-top:
            max(10px, env(safe-area-inset-top));

        padding-left: 14px;
        padding-right: 14px;
    }

    .breathing-area {

        min-height: 165px;

        max-height: 205px;
    }

    .breathing-ring {

        width: 180px;
        height: 180px;
    }

    .phase {

        font-size: 22px;
    }

    .seconds {

        font-size: 14px;
    }

    .meditation {

        font-size: 30px;

        margin-top: 7px;
    }

    .card {

        padding: 7px 10px;

        margin-bottom: 5px;
    }

    .sound-option {

        height: 24px;

        font-size: 10px;
    }

    .start-button {

        height: 45px;
    }

    .settings-button {

        height: 35px;

        margin-top: 5px;
    }
}


/* =========================================================
   TRÈS PETITS ÉCRANS
========================================================= */

@media (max-height: 620px) {

    .header .title {

        font-size: 20px;
    }

    .breathing-area {

        min-height: 135px;

        max-height: 160px;
    }

    .breathing-ring {

        width: 145px;
        height: 145px;

        border-width: 5px;
    }

    .phase {

        font-size: 18px;
    }

    .seconds {

        font-size: 12px;

        margin-top: 4px;
    }

    .meditation {

        font-size: 25px;

        margin-top: 5px;
    }

    .instruction {

        display: none;
    }

    .card {

        padding: 5px 8px;

        margin-bottom: 4px;
    }

    .card-title {

        font-size: 12px;
    }

    .sound-grid {

        gap: 4px;
    }

    .sound-column {

        padding: 4px 5px;
    }

    .sound-option {

        height: 21px;

        font-size: 9px;
    }

    .small-button {

        width: 28px;
        height: 28px;

        min-width: 28px;

        font-size: 18px;
    }

    .start-button {

        height: 42px;

        font-size: 15px;
    }
}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     TITRE
===================================================== -->

<header class="header">

    <div class="title">
        Cohérence cardiaque
    </div>

    <div class="subtitle">

        <span id="headerBreath">5</span>
        secondes inspiration

        •
        
        <span id="headerBreath2">5</span>
        secondes expiration

    </div>

</header>


<!-- =====================================================
     CERCLE
===================================================== -->

<section class="breathing-area">

    <div
        id="breathingRing"
        class="breathing-ring exhale">

        <div class="breathing-content">

            <div
                id="phase"
                class="phase">

                Prêt

            </div>

            <div class="seconds">

                <span id="phaseSeconds">5</span>
                secondes

            </div>

            <!-- PERSONNE EN MÉDITATION -->

            <div class="meditation">
                🧘
            </div>

        </div>

    </div>

</section>


<div class="instruction">

    Restez détendu et respirez naturellement.

</div>


<!-- =====================================================
     RYTHME
===================================================== -->

<section class="card">

    <div class="card-title">

        <span class="card-icon">〰</span>

        <span>
            Rythme respiratoire
        </span>

    </div>


    <div class="breath-controls">

        <div class="control-label">

            Inspiration / expiration

        </div>


        <div class="adjust">

            <button
                class="small-button"
                onclick="changeBreath(-1)">

                −

            </button>


            <div class="value">

                <span id="breathValue">
                    5
                </span>
                s

            </div>


            <button
                class="small-button"
                onclick="changeBreath(1)">

                +

            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     DURÉE
===================================================== -->

<section class="card">

    <div class="duration-top">

        <div class="card-title">

            <span class="card-icon">◷</span>

            <span>
                Durée
            </span>

        </div>


        <div
            id="remaining"
            class="remaining">

            05:00

        </div>

    </div>


    <div class="duration-controls">

        <button
            class="small-button"
            onclick="changeDuration(-1)">

            −

        </button>


        <div
            id="durationValue"
            class="duration-value">

            5 min

        </div>


        <button
            class="small-button"
            onclick="changeDuration(1)">

            +

        </button>

    </div>


    <input
        id="durationSlider"
        class="slider"
        type="range"
        min="1"
        max="60"
        value="5"
        oninput="sliderDuration(this.value)"
    >


    <div class="slider-labels">

        <span>1 min</span>

        <span>30 min</span>

        <span>60 min</span>

    </div>

</section>


<!-- =====================================================
     SONS
===================================================== -->

<section class="card">

    <div class="card-title">

        <span class="card-icon">♫</span>

        <span>
            Sons
        </span>

    </div>


    <div class="sound-grid">


        <!-- INSPIRATION -->

        <div class="sound-column">

            <div class="sound-heading">

                <div class="sound-dot green"></div>

                Inspiration

            </div>


            <button
                id="inspireBell"
                class="sound-option selected"
                onclick="selectSound('inhale','bell')">

                🔔 Cloche douce

            </button>


            <button
                id="inspireTone"
                class="sound-option"
                onclick="selectSound('inhale','tone')">

                ✨ Ton cristallin

            </button>


            <button
                id="inspirePulse"
                class="sound-option"
                onclick="selectSound('inhale','pulse')">

                🔔 Pulsation douce

            </button>

        </div>


        <!-- EXPIRATION -->

        <div class="sound-column">

            <div class="sound-heading">

                <div class="sound-dot blue"></div>

                Expiration

            </div>


            <button
                id="expireBowl"
                class="sound-option selected"
                onclick="selectSound('exhale','bowl')">

                🪷 Bol tibétain

            </button>


            <button
                id="expireTone"
                class="sound-option"
                onclick="selectSound('exhale','tone')">

                ✨ Ton profond

            </button>


            <button
                id="expirePulse"
                class="sound-option"
                onclick="selectSound('exhale','pulse')">

                🌊 Pulsation douce

            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     DÉMARRER
===================================================== -->

<button
    id="startButton"
    class="start-button"
    onclick="startSession()">

    ▶ &nbsp; Démarrer

</button>


<button
    id="stopButton"
    class="start-button stop-button"
    onclick="stopSession()">

    ■ &nbsp; Arrêter

</button>


<!-- =====================================================
     PARAMÈTRES DE L'ALARME
===================================================== -->

<button
    id="settingsButton"
    class="settings-button"
    onclick="toggleSettings()">

    ⚙️ &nbsp; Paramètres de l'alarme

</button>


<div
    id="settingsPanel"
    class="settings-panel">


    <!-- ACTIVATION ALARME -->

    <div class="settings-row">

        <div class="settings-label">

            Alarme de fin

        </div>


        <label class="switch">

            <input
                id="alarmEnabled"
                type="checkbox"
                checked
            >

            <span class="switch-slider"></span>

        </label>

    </div>


    <!-- RAPPEL -->

    <div class="settings-row">

        <div class="settings-label">

            Rappel d'alarme

        </div>


        <select
            id="snoozeInterval"
            style="
                background:#163d4d;
                color:white;
                border:none;
                border-radius:8px;
                padding:7px;
            ">

            <option value="0">
                Aucun
            </option>

            <option value="1">
                1 minute
            </option>

            <option value="2">
                2 minutes
            </option>

            <option value="5" selected>
                5 minutes
            </option>

            <option value="10">
                10 minutes
            </option>

        </select>

    </div>


    <!-- SON ALARME -->

    <div class="settings-row">

        <div class="settings-label">

            Son de l'alarme

        </div>


        <select
            id="alarmSound"
            style="
                background:#163d4d;
                color:white;
                border:none;
                border-radius:8px;
                padding:7px;
            ">

            <option value="gong" selected>
                Gong
            </option>

            <option value="chime">
                Carillon
            </option>

            <option value="bells">
                Cloches
            </option>

        </select>

    </div>

</div>


</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

let breathSeconds = 5;

let durationMinutes = 5;

let phase = "inhale";

let phaseRemaining = 5;

let sessionRemaining = 300;

let running = false;

let phaseTimer = null;

let sessionTimer = null;

let audioContext = null;

let inhaleSound = "bell";

let exhaleSound = "bowl";


/* =========================================================
   ALARME
========================================================= */

let alarmEnabled = true;

let snoozeInterval = 5;

let alarmSound = "gong";

let alarmTimer = null;


/* =========================================================
   AUDIO
========================================================= */

function createAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


/* =========================================================
   NOTE
========================================================= */

function playTone(
    frequency,
    duration,
    type = "sine",
    volume = .22
) {

    createAudio();


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.type = type;

    oscillator.frequency.value =
        frequency;


    const now =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        .0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + .04
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
    );


    oscillator.start(now);

    oscillator.stop(
        now + duration + .05
    );

}


/* =========================================================
   SONS RESPIRATION
========================================================= */

function playBreathSound(sound) {

    createAudio();


    /* -----------------------------------------
       1 NOTE
    ----------------------------------------- */

    if (sound === "bell") {

        playTone(
            660,
            .65,
            "sine"
        );

    }


    /* -----------------------------------------
       2 NOTES
    ----------------------------------------- */

    else if (sound === "tone") {

        playTone(
            520,
            .55,
            "sine"
        );


        setTimeout(
            () => {

                if (audioContext) {

                    playTone(
                        620,
                        .65,
                        "sine"
                    );

                }

            },
            240
        );

    }


    /* -----------------------------------------
       3 NOTES : HAUTE / BASSE / HAUTE
    ----------------------------------------- */

    else if (sound === "pulse") {

        playTone(
            660,
            .35,
            "sine"
        );


        setTimeout(
            () => {

                if (audioContext) {

                    playTone(
                        440,
                        .35,
                        "sine"
                    );

                }

            },
            180
        );


        setTimeout(
            () => {

                if (audioContext) {

                    playTone(
                        660,
                        .50,
                        "sine"
                    );

                }

            },
            360
        );

    }


    /* -----------------------------------------
       BOL TIBÉTAIN
    ----------------------------------------- */

    else if (sound === "bowl") {

        playTone(
            390,
            .9,
            "sine"
        );


        setTimeout(
            () => {

                if (audioContext) {

                    playTone(
                        520,
                        .7,
                        "sine"
                    );

                }

            },
            120
        );

    }

}


/* =========================================================
   ALARME
========================================================= */

function playAlarm() {

    if (!alarmEnabled) {
        return;
    }


    createAudio();


    if (alarmSound === "gong") {

        /*
         * GONG D'AU MOINS 5 SECONDES
         *
         * Plusieurs harmoniques sont lancées
         * avec une longue décroissance.
         */

        playTone(
            196,
            5.2,
            "sine",
            .28
        );


        setTimeout(
            () => {

                if (audioContext) {

                    playTone(
                        294,
                        4.8,
                        "sine",
                        .18
                    );

                }

            },
            120
        );


        setTimeout(
            () => {

                if (audioContext) {

                    playTone(
                        392,
                        4.5,
                        "sine",
                        .10
                    );

                }

            },
            240
        );

    }


    else if (alarmSound === "chime") {

        playTone(
            784,
            .8,
            "sine"
        );


        setTimeout(
            () => playTone(
                988,
                1.0,
                "sine"
            ),
            350
        );


        setTimeout(
            () => playTone(
                1175,
                1.4,
                "sine"
            ),
            750
        );

    }


    else if (alarmSound === "bells") {

        [523,659,784,659,523].forEach(
            (frequency, index) => {

                setTimeout(
                    () => playTone(
                        frequency,
                        .8,
                        "sine"
                    ),
                    index * 500
                );

            }
        );

    }

}


/* =========================================================
   RAPPEL
========================================================= */

function scheduleSnooze() {

    clearTimeout(alarmTimer);


    if (
        !alarmEnabled ||
        snoozeInterval <= 0
    ) {

        return;

    }


    alarmTimer =
        setTimeout(
            () => {

                playAlarm();

                scheduleSnooze();

            },
            snoozeInterval * 60 * 1000
        );

}


/* =========================================================
   PARAMÈTRES
========================================================= */

function toggleSettings() {

    const panel =
        document.getElementById(
            "settingsPanel"
        );

    panel.classList.toggle(
        "open"
    );

}


document.getElementById(
    "alarmEnabled"
).addEventListener(
    "change",
    function() {

        alarmEnabled =
            this.checked;

        if (!alarmEnabled) {

            clearTimeout(
                alarmTimer
            );

        }

    }
);


document.getElementById(
    "snoozeInterval"
).addEventListener(
    "change",
    function() {

        snoozeInterval =
            parseInt(
                this.value
            );

    }
);


document.getElementById(
    "alarmSound"
).addEventListener(
    "change",
    function() {

        alarmSound =
            this.value;

    }
);


/* =========================================================
   RYTHME
========================================================= */

function changeBreath(amount) {

    breathSeconds += amount;


    if (breathSeconds < 2) {

        breathSeconds = 2;

    }


    if (breathSeconds > 20) {

        breathSeconds = 20;

    }


    updateBreathDisplay();


    /*
     * Si la séance est en cours,
     * le nouveau rythme sera utilisé
     * à la prochaine phase.
     */

}


function updateBreathDisplay() {

    document.getElementById(
        "breathValue"
    ).textContent =
        breathSeconds;


    document.getElementById(
        "headerBreath"
    ).textContent =
        breathSeconds;


    document.getElementById(
        "headerBreath2"
    ).textContent =
        breathSeconds;


    if (!running) {

        document.getElementById(
            "phaseSeconds"
        ).textContent =
            breathSeconds;

    }

}


/* =========================================================
   DURÉE
========================================================= */

function changeDuration(amount) {

    durationMinutes += amount;


    if (durationMinutes < 1) {

        durationMinutes = 1;

    }


    if (durationMinutes > 60) {

        durationMinutes = 60;

    }


    updateDuration();

}


function sliderDuration(value) {

    durationMinutes =
        parseInt(value);


    updateDuration();

}


function updateDuration() {

    document.getElementById(
        "durationValue"
    ).textContent =
        durationMinutes + " min";


    document.getElementById(
        "durationSlider"
    ).value =
        durationMinutes;


    const progress =
        ((durationMinutes - 1) / 59) * 100;


    document.getElementById(
        "durationSlider"
    ).style.setProperty(
        "--progress",
        progress + "%"
    );


    if (!running) {

        updateRemaining(
            durationMinutes * 60
        );

    }

}


/* =========================================================
   SÉLECTION DES SONS
========================================================= */

function selectSound(
    type,
    sound
) {


    if (type === "inhale") {

        inhaleSound =
            sound;


        document
            .querySelectorAll(
                "#inspireBell, #inspireTone, #inspirePulse"
            )
            .forEach(
                button =>
                    button.classList.remove(
                        "selected"
                    )
            );


        document.getElementById(
            "inspire" +
            capitalize(sound)
        ).classList.add(
            "selected"
        );


        playBreathSound(
            sound
        );

    }


    else {

        exhaleSound =
            sound;


        document
            .querySelectorAll(
                "#expireBowl, #expireTone, #expirePulse"
            )
            .forEach(
                button =>
                    button.classList.remove(
                        "selected"
                    )
            );


        document.getElementById(
            "expire" +
            capitalize(sound)
        ).classList.add(
            "selected"
        );


        playBreathSound(
            sound
        );

    }

}


function capitalize(text) {

    return text.charAt(0).toUpperCase()
        + text.slice(1);

}


/* =========================================================
   DÉMARRER
========================================================= */

function startSession() {

    createAudio();


    clearTimeout(
        alarmTimer
    );


    running = true;


    sessionRemaining =
        durationMinutes * 60;


    phase =
        "inhale";


    phaseRemaining =
        breathSeconds;


    document.getElementById(
        "startButton"
    ).style.display =
        "none";


    document.getElementById(
        "stopButton"
    ).style.display =
        "block";


    beginPhase();


    sessionTimer =
        setInterval(
            () => {

                sessionRemaining--;


                updateRemaining(
                    sessionRemaining
                );


                if (
                    sessionRemaining <= 0
                ) {

                    finishSession();

                }

            },
            1000
        );

}


/* =========================================================
   RESPIRATION
========================================================= */

function beginPhase() {

    clearInterval(
        phaseTimer
    );


    /*
     * Utilise toujours la valeur
     * actuelle de breathSeconds.
     */

    phaseRemaining =
        breathSeconds;


    const ring =
        document.getElementById(
            "breathingRing"
        );


    const phaseText =
        document.getElementById(
            "phase"
        );


    ring.style.setProperty(
        "--breath-duration",
        breathSeconds + "s"
    );


    if (
        phase === "inhale"
    ) {

        phaseText.textContent =
            "Inspiration";


        ring.classList.remove(
            "exhale"
        );


        ring.classList.add(
            "inhale"
        );


        playBreathSound(
            inhaleSound
        );

    }


    else {

        phaseText.textContent =
            "Expiration";


        ring.classList.remove(
            "inhale"
        );


        ring.classList.add(
            "exhale"
        );


        playBreathSound(
            exhaleSound
        );

    }


    document.getElementById(
        "phaseSeconds"
    ).textContent =
        phaseRemaining;


    phaseTimer =
        setInterval(
            () => {

                phaseRemaining--;


                if (
                    phaseRemaining < 0
                ) {

                    phaseRemaining = 0;

                }


                document.getElementById(
                    "phaseSeconds"
                ).textContent =
                    phaseRemaining;


                if (
                    phaseRemaining <= 0
                ) {

                    clearInterval(
                        phaseTimer
                    );


                    phase =
                        phase === "inhale"
                            ? "exhale"
                            : "inhale";


                    beginPhase();

                }

            },
            1000
        );

}


/* =========================================================
   TEMPS RESTANT
========================================================= */

function updateRemaining(
    seconds
) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    const formatted =
        String(minutes)
            .padStart(2, "0")
        + ":"
        +
        String(secs)
            .padStart(2, "0");


    document.getElementById(
        "remaining"
    ).textContent =
        formatted;

}


/* =========================================================
   ARRÊTER
========================================================= */

function stopSession() {

    running = false;


    clearInterval(
        phaseTimer
    );


    clearInterval(
        sessionTimer
    );


    clearTimeout(
        alarmTimer
    );


    const ring =
        document.getElementById(
            "breathingRing"
        );


    ring.classList.remove(
        "inhale"
    );


    ring.classList.add(
        "exhale"
    );


    document.getElementById(
        "phase"
    ).textContent =
        "Prêt";


    document.getElementById(
        "phaseSeconds"
    ).textContent =
        breathSeconds;


    document.getElementById(
        "startButton"
    ).style.display =
        "block";


    document.getElementById(
        "stopButton"
    ).style.display =
        "none";


    updateRemaining(
        durationMinutes * 60
    );

}


/* =========================================================
   FIN DE SESSION
========================================================= */

function finishSession() {

    running = false;


    clearInterval(
        phaseTimer
    );


    clearInterval(
        sessionTimer
    );


    document.getElementById(
        "phase"
    ).textContent =
        "Terminé";


    document.getElementById(
        "phaseSeconds"
    ).textContent =
        "✓";


    document.getElementById(
        "remaining"
    ).textContent =
        "00:00";


    document.getElementById(
        "startButton"
    ).style.display =
        "block";


    document.getElementById(
        "stopButton"
    ).style.display =
        "none";


    /*
     * Si l'alarme est désactivée,
     * absolument aucun son.
     */

    if (alarmEnabled) {

        playAlarm();

        scheduleSnooze();

    }

}


/* =========================================================
   INITIALISATION
========================================================= */

updateBreathDisplay();

updateDuration();

</script>

</body>
</html>
