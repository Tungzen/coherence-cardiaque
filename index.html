<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cohérence">

<title>Cohérence cardiaque</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #06253a;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    height: 100vh;
    min-height: 620px;
    padding: max(18px, env(safe-area-inset-top)) 20px 15px;
    display: flex;
    flex-direction: column;
}

/* =========================
   TITRE
========================= */

.header {
    text-align: center;
    flex-shrink: 0;
}

.title {
    font-size: 27px;
    font-weight: 500;
    margin-top: 3px;
    margin-bottom: 3px;
}

.subtitle {
    color: #c5d6dd;
    font-size: 14px;
}

/* =========================
   CERCLE
========================= */

.breathing-area {
    flex: 1;
    min-height: 225px;
    max-height: 330px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.breathing-ring {
    width: min(245px, 54vw);
    height: min(245px, 54vw);

    border-radius: 50%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #103e50 0%,
            #0b3446 70%,
            #092e40 100%
        );

    border: 7px solid #54dcae;

    box-shadow:
        0 0 25px rgba(82,220,174,.12),
        inset 0 0 30px rgba(0,0,0,.12);

    transform: scale(.84);

    transition:
        transform var(--breath-duration, 5s) ease-in-out,
        border-color .5s ease;
}

.breathing-ring::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 3px solid rgba(67,183,255,.75);
    border-right-color: #60dfa9;
    border-bottom-color: #60dfa9;
    pointer-events: none;
}

.breathing-ring.inhale {
    transform: scale(1.02);
}

.breathing-ring.exhale {
    transform: scale(.84);
}

.breathing-content {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;
    z-index: 2;
}

.phase {
    color: #61e3ae;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0;
}

.seconds {
    font-size: 18px;
    margin-top: 7px;
    color: white;
}

.lungs {
    font-size: 38px;
    line-height: 1;
    margin-top: 13px;
}

/* =========================
   INSTRUCTION
========================= */

.instruction {
    text-align: center;
    color: #aebfc7;
    font-size: 14px;
    margin-bottom: 10px;
}

/* =========================
   CARDS
========================= */

.card {
    background: rgba(19,67,87,.76);
    border: 1px solid rgba(180,220,230,.13);
    border-radius: 16px;
    padding: 11px 15px;
    margin-bottom: 9px;
    flex-shrink: 0;
}

.card-title {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 15px;
    font-weight: 500;
}

.card-icon {
    font-size: 21px;
    color: #52b9ff;
}

/* =========================
   RYTHME
========================= */

.breath-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 7px;
}

.control-label {
    color: #dbe5e9;
    font-size: 14px;
}

.adjust {
    display: flex;
    align-items: center;
    gap: 12px;
}

.small-button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 21px;
    line-height: 1;
}

.value {
    min-width: 72px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
}

/* =========================
   DURÉE
========================= */

.duration-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.remaining {
    color: #63e3ae;
    font-size: 20px;
}

.duration-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin-top: 5px;
}

.duration-value {
    min-width: 75px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
}

.slider {
    width: 100%;
    height: 5px;
    margin-top: 6px;

    appearance: none;
    border-radius: 5px;

    background:
        linear-gradient(
            90deg,
            #61dfab var(--progress),
            rgba(255,255,255,.18) var(--progress)
        );
}

.slider::-webkit-slider-thumb {
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #62dfac;
    border: 3px solid #174c56;
}

.slider-labels {
    display: flex;
    justify-content: space-between;
    color: #8faab5;
    font-size: 10px;
    margin-top: 2px;
}

/* =========================
   SONS
========================= */

.sound-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 7px;
}

.sound-column {
    background: rgba(0,0,0,.10);
    border-radius: 10px;
    padding: 6px 8px;
}

.sound-heading {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    margin-bottom: 4px;
}

.sound-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
}

.green {
    background: #61dfa9;
}

.blue {
    background: #48a9ff;
}

.sound-option {
    width: 100%;
    height: 28px;

    border: none;
    border-radius: 7px;

    background: transparent;

    color: #b8cbd3;

    text-align: left;

    padding: 0 6px;

    font-size: 12px;
}

.sound-option.selected {
    background: rgba(98,225,174,.18);
    color: white;
}

/* =========================
   BOUTON
========================= */

.start-button {
    width: 100%;
    height: 51px;

    border: none;
    border-radius: 15px;

    background: linear-gradient(
        90deg,
        #61dfa9,
        #5edbaa
    );

    color: white;

    font-size: 18px;
    font-weight: 600;

    flex-shrink: 0;

    margin-top: 1px;
}

.stop-button {
    display: none;
    background: linear-gradient(
        90deg,
        #db686d,
        #c85862
    );
}

.start-button:active {
    transform: scale(.985);
}

/* =========================
   PETITS ÉCRANS
========================= */

@media (max-height: 700px) {

    .title {
        font-size: 24px;
    }

    .subtitle {
        font-size: 12px;
    }

    .breathing-area {
        min-height: 190px;
        max-height: 230px;
    }

    .breathing-ring {
        width: 190px;
        height: 190px;
    }

    .phase {
        font-size: 23px;
    }

    .seconds {
        font-size: 16px;
    }

    .lungs {
        font-size: 30px;
        margin-top: 8px;
    }

    .card {
        padding: 8px 12px;
        margin-bottom: 6px;
    }

    .instruction {
        margin-bottom: 6px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- TITRE -->

    <header class="header">

        <div class="title">
            Cohérence cardiaque
        </div>

        <div class="subtitle">
            <span id="headerBreath">5</span> secondes inspiration
            •
            <span id="headerBreath2">5</span> secondes expiration
        </div>

    </header>


    <!-- CERCLE -->

    <section class="breathing-area">

        <div
            id="breathingRing"
            class="breathing-ring exhale">

            <div class="breathing-content">

                <div
                    id="phase"
                    class="phase">
                    Prêt
                </div>

                <div class="seconds">
                    <span id="phaseSeconds">5</span>
                    secondes
                </div>

                <div class="lungs">
                    ♧
                </div>

            </div>

        </div>

    </section>


    <div class="instruction">
        Restez détendu et respirez naturellement.
    </div>


    <!-- RYTHME -->

    <section class="card">

        <div class="card-title">
            <span class="card-icon">〰</span>
            <span>Rythme respiratoire</span>
        </div>

        <div class="breath-controls">

            <div class="control-label">
                Inspiration / expiration
            </div>

            <div class="adjust">

                <button
                    class="small-button"
                    onclick="changeBreath(-1)">
                    −
                </button>

                <div class="value">
                    <span id="breathValue">5</span> s
                </div>

                <button
                    class="small-button"
                    onclick="changeBreath(1)">
                    +
                </button>

            </div>

        </div>

    </section>


    <!-- DURÉE -->

    <section class="card">

        <div class="duration-top">

            <div class="card-title">
                <span class="card-icon">◷</span>
                <span>Durée</span>
            </div>

            <div
                id="remaining"
                class="remaining">
                05:00
            </div>

        </div>


        <div class="duration-controls">

            <button
                class="small-button"
                onclick="changeDuration(-1)">
                −
            </button>

            <div
                id="durationValue"
                class="duration-value">
                5 min
            </div>

            <button
                class="small-button"
                onclick="changeDuration(1)">
                +
            </button>

        </div>


        <input
            id="durationSlider"
            class="slider"
            type="range"
            min="1"
            max="60"
            value="5"
            oninput="sliderDuration(this.value)"
        >

        <div class="slider-labels">
            <span>1 min</span>
            <span>30 min</span>
            <span>60 min</span>
        </div>

    </section>


    <!-- SONS -->

    <section class="card">

        <div class="card-title">
            <span class="card-icon">♫</span>
            <span>Sons</span>
        </div>


        <div class="sound-grid">

            <!-- INSPIRATION -->

            <div class="sound-column">

                <div class="sound-heading">

                    <div class="sound-dot green"></div>

                    Inspiration

                </div>

                <button
                    id="inspireBell"
                    class="sound-option selected"
                    onclick="selectSound('inhale','bell')">
                    🔔 Cloche douce
                </button>

                <button
                    id="inspireTone"
                    class="sound-option"
                    onclick="selectSound('inhale','tone')">
                    ✨ Ton cristallin
                </button>

                <button
                    id="inspirePulse"
                    class="sound-option"
                    onclick="selectSound('inhale','pulse')">
                    🔔 Pulsation douce
                </button>

            </div>


            <!-- EXPIRATION -->

            <div class="sound-column">

                <div class="sound-heading">

                    <div class="sound-dot blue"></div>

                    Expiration

                </div>

                <button
                    id="expireBowl"
                    class="sound-option selected"
                    onclick="selectSound('exhale','bowl')">
                    🪷 Bol tibétain
                </button>

                <button
                    id="expireTone"
                    class="sound-option"
                    onclick="selectSound('exhale','tone')">
                    ✨ Ton profond
                </button>

                <button
                    id="expirePulse"
                    class="sound-option"
                    onclick="selectSound('exhale','pulse')">
                    🌊 Pulsation douce
                </button>

            </div>

        </div>

    </section>


    <!-- DÉMARRER -->

    <button
        id="startButton"
        class="start-button"
        onclick="startSession()">

        ▶ &nbsp; Démarrer

    </button>


    <button
        id="stopButton"
        class="start-button stop-button"
        onclick="stopSession()">

        ■ &nbsp; Arrêter

    </button>

</div>


<script>

/* ============================================
   VARIABLES
============================================ */

let breathSeconds = 5;

let durationMinutes = 5;

let phase = "inhale";

let phaseRemaining = 5;

let sessionRemaining = 300;

let running = false;

let phaseTimer = null;

let sessionTimer = null;

let audioContext = null;

let inhaleSound = "bell";

let exhaleSound = "bowl";


/* ============================================
   AUDIO
============================================ */

function createAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


function playTone(
    frequency,
    duration,
    type = "sine"
) {

    createAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    const now =
        audioContext.currentTime;

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .22,
        now + .03
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + duration
    );

    oscillator.start(now);

    oscillator.stop(
        now + duration + .05
    );

}


function playBreathSound(sound) {

    createAudio();

    if (sound === "bell") {

        playTone(
            660,
            .55
        );

    }

    else if (sound === "tone") {

        playTone(
            520,
            .65
        );

    }

    else if (sound === "pulse") {

        playTone(
            440,
            .25
        );

        setTimeout(
            () => playTone(
                520,
                .25
            ),
            180
        );

    }

    else if (sound === "bowl") {

        playTone(
            390,
            .9
        );

        setTimeout(
            () => playTone(
                520,
                .7
            ),
            120
        );

    }

}


/* ============================================
   SON FIN
============================================ */

function playEndSound() {

    createAudio();

    const notes =
        [523, 659, 784, 1046];

    notes.forEach(
        (frequency, index) => {

            setTimeout(
                () => playTone(
                    frequency,
                    .65
                ),
                index * 190
            );

        }
    );

}


/* ============================================
   RYTHME
============================================ */

function changeBreath(amount) {

    if (running) return;

    breathSeconds += amount;

    if (breathSeconds < 2) {
        breathSeconds = 2;
    }

    if (breathSeconds > 20) {
        breathSeconds = 20;
    }

    updateBreathDisplay();

}


function updateBreathDisplay() {

    document.getElementById(
        "breathValue"
    ).textContent =
        breathSeconds;

    document.getElementById(
        "headerBreath"
    ).textContent =
        breathSeconds;

    document.getElementById(
        "headerBreath2"
    ).textContent =
        breathSeconds;

    document.getElementById(
        "phaseSeconds"
    ).textContent =
        breathSeconds;

}


/* ============================================
   DURÉE
============================================ */

function changeDuration(amount) {

    if (running) return;

    durationMinutes += amount;

    if (durationMinutes < 1) {
        durationMinutes = 1;
    }

    if (durationMinutes > 60) {
        durationMinutes = 60;
    }

    updateDuration();

}


function sliderDuration(value) {

    if (running) return;

    durationMinutes =
        parseInt(value);

    updateDuration();

}


function updateDuration() {

    document.getElementById(
        "durationValue"
    ).textContent =
        durationMinutes + " min";

    document.getElementById(
        "durationSlider"
    ).value =
        durationMinutes;

    const progress =
        ((durationMinutes - 1) / 59) * 100;

    document.getElementById(
        "durationSlider"
    ).style.setProperty(
        "--progress",
        progress + "%"
    );

    updateRemaining(
        durationMinutes * 60
    );

}


/* ============================================
   SÉLECTION DES SONS
============================================ */

function selectSound(
    type,
    sound
) {

    if (running) return;

    if (type === "inhale") {

        inhaleSound = sound;

        document
            .querySelectorAll(
                "#inspireBell, #inspireTone, #inspirePulse"
            )
            .forEach(
                button =>
                    button.classList.remove(
                        "selected"
                    )
            );

        document.getElementById(
            "inspire" +
            capitalize(sound)
        ).classList.add(
            "selected"
        );

        playBreathSound(sound);

    }

    else {

        exhaleSound = sound;

        document
            .querySelectorAll(
                "#expireBowl, #expireTone, #expirePulse"
            )
            .forEach(
                button =>
                    button.classList.remove(
                        "selected"
                    )
            );

        document.getElementById(
            "expire" +
            capitalize(sound)
        ).classList.add(
            "selected"
        );

        playBreathSound(sound);

    }

}


function capitalize(text) {

    return text.charAt(0).toUpperCase()
        + text.slice(1);

}


/* ============================================
   DÉMARRER
============================================ */

function startSession() {

    createAudio();

    running = true;

    sessionRemaining =
        durationMinutes * 60;

    phase =
        "inhale";

    phaseRemaining =
        breathSeconds;

    document.getElementById(
        "startButton"
    ).style.display =
        "none";

    document.getElementById(
        "stopButton"
    ).style.display =
        "block";

    beginPhase();

    sessionTimer =
        setInterval(
            () => {

                sessionRemaining--;

                updateRemaining(
                    sessionRemaining
                );

                if (
                    sessionRemaining <= 0
                ) {

                    finishSession();

                }

            },
            1000
        );

}


/* ============================================
   RESPIRATION
============================================ */

function beginPhase() {

    clearInterval(
        phaseTimer
    );

    phaseRemaining =
        breathSeconds;

    const ring =
        document.getElementById(
            "breathingRing"
        );

    const phaseText =
        document.getElementById(
            "phase"
        );

    ring.style.setProperty(
        "--breath-duration",
        breathSeconds + "s"
    );


    if (
        phase === "inhale"
    ) {

        phaseText.textContent =
            "Inspiration";

        ring.classList.remove(
            "exhale"
        );

        ring.classList.add(
            "inhale"
        );

        playBreathSound(
            inhaleSound
        );

    }

    else {

        phaseText.textContent =
            "Expiration";

        ring.classList.remove(
            "inhale"
        );

        ring.classList.add(
            "exhale"
        );

        playBreathSound(
            exhaleSound
        );

    }


    document.getElementById(
        "phaseSeconds"
    ).textContent =
        phaseRemaining;


    phaseTimer =
        setInterval(
            () => {

                phaseRemaining--;

                if (
                    phaseRemaining < 0
                ) {

                    phaseRemaining = 0;

                }

                document.getElementById(
                    "phaseSeconds"
                ).textContent =
                    phaseRemaining;


                if (
                    phaseRemaining <= 0
                ) {

                    clearInterval(
                        phaseTimer
                    );

                    phase =
                        phase === "inhale"
                            ? "exhale"
                            : "inhale";

                    beginPhase();

                }

            },
            1000
        );

}


/* ============================================
   TEMPS RESTANT
============================================ */

function updateRemaining(
    seconds
) {

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    const formatted =
        String(minutes)
            .padStart(2, "0")
        + ":" +
        String(secs)
            .padStart(2, "0");

    document.getElementById(
        "remaining"
    ).textContent =
        formatted;

}


/* ============================================
   ARRÊTER
============================================ */

function stopSession() {

    running = false;

    clearInterval(
        phaseTimer
    );

    clearInterval(
        sessionTimer
    );

    const ring =
        document.getElementById(
            "breathingRing"
        );

    ring.classList.remove(
        "inhale"
    );

    ring.classList.add(
        "exhale"
    );

    document.getElementById(
        "phase"
    ).textContent =
        "Prêt";

    document.getElementById(
        "phaseSeconds"
    ).textContent =
        breathSeconds;

    document.getElementById(
        "startButton"
    ).style.display =
        "block";

    document.getElementById(
        "stopButton"
    ).style.display =
        "none";

    updateRemaining(
        durationMinutes * 60
    );

}


/* ============================================
   FIN DE SESSION
============================================ */

function finishSession() {

    running = false;

    clearInterval(
        phaseTimer
    );

    clearInterval(
        sessionTimer
    );

    document.getElementById(
        "phase"
    ).textContent =
        "Terminé";

    document.getElementById(
        "phaseSeconds"
    ).textContent =
        "✓";

    document.getElementById(
        "remaining"
    ).textContent =
        "00:00";

    document.getElementById(
        "startButton"
    ).style.display =
        "block";

    document.getElementById(
        "stopButton"
    ).style.display =
        "none";

    playEndSound();

}


/* ============================================
   INITIALISATION
============================================ */

updateBreathDisplay();

updateDuration();

</script>

</body>
</html>
